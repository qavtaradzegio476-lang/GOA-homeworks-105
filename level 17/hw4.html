<!--  შექმენი პატარა „ონლაინ მენიუ“.
მოიფიქრე კაფე და ჩამოწერე მინიმუმ 6 კერძი <ul>-ის გამოყენებით. დაამატე კაფის ერთი ფოტო და მისი სახელი <h1>-ით.
 -->

```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჩემი კაფე</title>
</head>
<body>

    <h1>Sweet Cafe</h1>

    <img src="https://images.unsplash.com/photo-1554118811-1e0d58224f24"
         width="400"
         alt="კაფის ფოტო">

    <h2>ჩვენი მენიუ</h2>

    <ul>
        <li>პიცა</li>
        <li>ბურგერი</li>
        <li>ხინკალი</li>
        <li>ცეზარის სალათი</li>
        <li>ჩიზქეიქი</li>
        <li>შოკოლადის ტორტი</li>
    </ul>

</body>
</html>
```
